version: "3.8"

services:
  # --- TRẠM CƠ SỞ DỮ LIỆU CỤC BỘ (HỖ TRỢ RAG QUA PGVECTOR) ---
  db:
    image: pgvector/pgvector:pg16
    container_name: hr_assistant_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hr_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hr_assistant}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- LOCAL LLM SERVER (ĐẢM BẢO 100% BẢO MẬT DỮ LIỆU) ---
  ollama:
    image: ollama/ollama:latest
    container_name: hr_assistant_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    pull_policy: always
    tty: true
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- BACKEND FASTAPI APPLICATION ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
