version: "3.8"

services:
  # --- TRẠM CƠ SỞ DỮ LIỆU CỤC BỘ (HỖ TRỢ RAG QUA PGVECTOR) ---
  db:
    image: pgvector/pgvector:pg16
    container_name: hr_assistant_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hr_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hr_assistant}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- LOCAL LLM SERVER (ĐẢM BẢO 100% BẢO MẬT DỮ LIỆU) ---
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: hr_assistant_ollama
  #   restart: always
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  # NẾU MÁY CỦA BẠN CÓ GPU NVIDIA, HÃY BỎ DẤU # Ở CÁC DÒNG DƯỚI ĐỂ CHẠY CHO NHANH:
  # deploy:
  #   resources:
  #     reservations:
  #       devices:
  #         - driver: nvidia
  #           count: all
  #           capabilities: [gpu]

  # --- BACKEND FASTAPI APPLICATION ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hr_assistant}}
      # - OLLAMA_BASE_URL=http://ollama:11434
      - JWT_SECRET=${JWT_SECRET:-super_secret_key_change_me_in_production_1234567890}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  # ollama_data:
  #   driver: local
